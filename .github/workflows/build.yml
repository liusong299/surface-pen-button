name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework 4.x csc (same as on a user's PC)
        shell: cmd
        run: build.bat

      - name: Run core tests
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /r:System.Drawing.dll /out:CoreTests.exe tests\CoreTests.cs src\Core.cs || exit /b 1
          CoreTests.exe

      - name: Render the settings window to PNG (also creates the button programs)
        shell: cmd
        run: |
          start /wait "" PenButton.exe --render shots\zh --lang zh --dir "%CD%"
          start /wait "" PenButton.exe --render shots\en --lang en --dir "%CD%"
          if exist shots\zh\error.txt (type shots\zh\error.txt & exit /b 1)
          if exist shots\en\error.txt (type shots\en\error.txt & exit /b 1)
          for %%F in (PenClick.exe PenDoubleClick.exe PenHold.exe) do if not exist %%F (echo %%F was not created & exit /b 1)
          fc /b PenButton.exe PenHold.exe >nul || (echo PenHold.exe differs from PenButton.exe & exit /b 1)
          dir *.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

      - uses: actions/upload-artifact@v4
        with:
          name: PenButton
          path: PenButton.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PenButton.exe
