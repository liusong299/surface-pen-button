name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the .NET Framework 4.x csc (same as on a user's PC)
        shell: cmd
        run: build.bat

      - name: Run core tests
        shell: cmd
        run: |
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /r:System.Drawing.dll /out:CoreTests.exe tests\CoreTests.cs src\Core.cs || exit /b 1
          CoreTests.exe || exit /b 1
          "%WINDIR%\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /codepage:65001 /r:System.Drawing.dll /r:System.Web.Extensions.dll /out:UpdaterTests.exe tests\UpdaterTests.cs src\Updater.cs src\Core.cs || exit /b 1
          UpdaterTests.exe

      - name: Render the settings window to PNG (also creates the button programs)
        shell: cmd
        run: |
          rem Render from C:\Tools\PenButton so the screenshots show a realistic folder
          mkdir C:\Tools\PenButton
          copy PenButton.exe C:\Tools\PenButton\ >nul
          set "APP=C:\Tools\PenButton"
          start /wait "" %APP%\PenButton.exe --render "%CD%\shots\zh" --lang zh
          start /wait "" %APP%\PenButton.exe --render "%CD%\shots\en" --lang en
          if exist shots\zh\error.txt (type shots\zh\error.txt & exit /b 1)
          if exist shots\en\error.txt (type shots\en\error.txt & exit /b 1)
          for %%F in (PenClick.exe PenDoubleClick.exe PenHold.exe) do if not exist %APP%\%%F (echo %%F was not created & exit /b 1)
          fc /b %APP%\PenClick.exe %APP%\PenHold.exe >nul || (echo the button programs differ & exit /b 1)
          fc /b %APP%\PenButton.exe %APP%\PenHold.exe >nul && (echo PenHold.exe should be the small program & exit /b 1)
          copy %APP%\PenClick.exe . >nul & copy %APP%\PenDoubleClick.exe . >nul & copy %APP%\PenHold.exe . >nul
          dir %APP%

      - name: The button program runs a gesture and exits
        shell: pwsh
        run: |
          "[Default]`r`nClick=none`r`nDoubleClick=none`r`nHold=none`r`n[Settings]`r`nLog=true`r`n" | Set-Content -Encoding utf8 PenButton.ini
          $p = Start-Process -FilePath .\PenHold.exe -PassThru -Wait
          Get-Content PenButton.log
          if ($p.ExitCode -ne 0) { throw "PenHold.exe exited with $($p.ExitCode)" }
          if (-not (Select-String -Path PenButton.log -Pattern "Hold .*action=none" -Quiet)) { throw "no Hold entry in the log" }
          Remove-Item PenButton.ini, PenButton.log

      - name: Self-update works against the real GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory upd | Out-Null
          Copy-Item PenButton.exe upd\
          $p = Start-Process -FilePath upd\PenButton.exe -ArgumentList '--update-selftest','--pretend-version','0.0.1' -PassThru -Wait
          Get-Content upd\update-selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-update test exited with $($p.ExitCode)" }
          if (-not (Test-Path upd\PenButton.exe.old)) { throw "the old exe was not kept as .old" }
          $v = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path upd\PenButton.exe)).Version
          Write-Host "after update: $v"
          Remove-Item -Recurse -Force upd

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

      - uses: actions/upload-artifact@v4
        with:
          name: PenButton
          path: PenButton.exe

      # A new version number on main (AppInfo.Version in src/Core.cs) publishes a release
      # with PenButton.exe. Pushing a v* tag does the same.
      - name: Check for a new version
        id: ver
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path src/Core.cs -Pattern 'Version = "([0-9.]+)"' | Select-Object -First 1
          $v = "v" + $m.Matches[0].Groups[1].Value
          gh release view $v --repo ${{ github.repository }} *> $null
          $new = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          "tag=$v" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "version $v, new release: $new"
          exit 0

      - name: Release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PenButton ${{ steps.ver.outputs.tag }}
          body_path: .github/release-notes.md
          files: PenButton.exe
